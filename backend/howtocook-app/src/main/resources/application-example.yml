# =====================================================================
# application-example.yml —— 主应用配置模板（进 git）
#
# 用法：
#   1. 复制本文件为同目录下的 application.yml
#   2. 在 application.yml 中填入真实值（application.yml 已在 .gitignore 忽略，不进仓库）
#
# 约定：
#   - 密钥类（DB 密码 / API Key / RustFS 凭据 / MCP 内部 Token）一律走环境变量，任何文件都不写死。
#   - 本模板只保留「配置项 + 注释 + 占位」，不含真实取值。
#   - 真实取值（模型名 / base-url / 融合权重等）见本地 application.yml 与 方案设计.md §9.0（均不进 git）。
#   - chat 与 embedding 不得混用 Key（分别用 LLM_COOK_API_KEY / LLM_EMBEDDING_API_KEY）。
# =====================================================================
spring:
  application:
    name:                              # 应用名
  datasource:
    url:                               # PostgreSQL JDBC URL
    username:                          # DB 用户名（建议 ${PG_USER}）
    password:                          # DB 密码（走环境变量 ${PG_PASSWORD}）
  flyway:
    enabled: true                      # 启用 Flyway
    locations: classpath:db/migration  # 迁移脚本目录（固定）
  data:
    redis:
      host:                            # Redis 主机（建议 ${REDIS_HOST}）
      port:                            # Redis 端口
  servlet:
    multipart:
      max-file-size:                   # 上传体积上限（仅限小体积 markdown）
  ai:
    openai:
      base-url:                        # chat 服务 base-url
      api-key:                         # 环境变量 ${LLM_COOK_API_KEY}
      embedding:
        model:                         # 向量模型名
        api-key:                       # 环境变量 ${LLM_EMBEDDING_API_KEY}，与 chat 不混用
        base-url:                      # 向量服务 base-url（账号专属，务必留本地）
      chat:
        model:                         # 对话模型名
        completions-path: /chat/completions   # OpenAI 兼容对话路径（固定）
        temperature:                   # 采样温度

sa-token:                              # 具体项 Step 1.2 敲定
  token-name: Authorization            # Token 请求头名（固定）
  timeout:                             # Token 有效期（秒）

howtocook:
  storage:                             # RustFS（S3 兼容）
    endpoint:                          # 环境变量 ${RUSTFS_ENDPOINT}
    access-key:                        # 环境变量 ${RUSTFS_ACCESS_KEY}
    secret-key:                        # 环境变量 ${RUSTFS_SECRET_KEY}
    bucket:                            # 桶名
  retrieval:
    vector-weight:                     # 向量融合权重（方案设计敲定）
    keyword-weight:                    # 关键词融合权重
    top-k:                             # 融合后返回条数
    recall-size:                       # 两路各自召回条数
  agent:
    max-rounds:                        # Agent 最大工具调用轮数
    tool-timeout-seconds:              # 单次工具调用超时（秒）
    memory-window:                     # ChatMemory 携带最近消息条数
  security:
    internal-token:                    # 环境变量 ${MCP_INTERNAL_TOKEN}，调 MCP Server 的预共享 Token
