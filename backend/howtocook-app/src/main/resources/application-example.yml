# =====================================================================
# application-example.yml —— 主应用配置模板（进 git）
#
# 用法：
#   1. 复制本文件为同目录下的 application.yml
#   2. 在 application.yml 中填入真实值（application.yml 已在 .gitignore 忽略，不进仓库）
#
# 约定：
#   - 密钥类（DB 密码 / API Key / RustFS 凭据 / MCP 内部 Token）一律走环境变量，任何文件都不写死。
#   - 本模板只保留「配置项 + 注释 + 占位」，不含真实取值。
#   - 真实取值（模型名 / base-url / 融合权重等）见本地 application.yml 与 方案设计.md §9.0（均不进 git）。
#   - chat 与 embedding 不得混用 Key（分别用 LLM_COOK_API_KEY / LLM_EMBEDDING_API_KEY）。
# =====================================================================
spring:
  application:
    name:                              # 应用名
  datasource:
    url:                               # PostgreSQL JDBC URL，如 jdbc:postgresql://localhost:5432/howtocook?stringtype=unspecified
                                       #   stringtype=unspecified：message 表的 references/trace 为 JSONB 列，
                                       #   实体以 String 存取，需此参数让 PG 自动完成 varchar→jsonb 隐式转换
    username:                          # DB 用户名（建议 ${PG_USER}）
    password:                          # DB 密码（走环境变量 ${PG_PASSWORD}）
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size:               # 连接池上限
      minimum-idle:                    # 最小空闲连接
      connection-timeout:              # 获取连接超时（毫秒）
  flyway:
    enabled: true                      # 启用 Flyway
    locations: classpath:db/migration  # 迁移脚本目录（固定）
    baseline-on-migrate: true          # 已有库首次纳入管理时自动 baseline
  data:
    redis:
      host:                            # Redis 主机（建议 ${REDIS_HOST}）
      port:                            # Redis 端口
      database: 0                      # Redis 库序号
  servlet:
    multipart:
      max-file-size:                   # 上传体积上限（仅限小体积 markdown）
      max-request-size:                # 单请求体积上限
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss   # java.util.Date 格式（LocalDateTime 由 common/JacksonConfig 注册）
    time-zone: GMT+8
    default-property-inclusion: non_null
  ai:
    openai:
      base-url:                        # chat 服务 base-url
      api-key:                         # 环境变量 ${LLM_COOK_API_KEY}
      embedding:
        model:                         # 向量模型名
        api-key:                       # 环境变量 ${LLM_EMBEDDING_API_KEY}，与 chat 不混用
        base-url:                      # 向量服务 base-url（账号专属，务必留本地）
      chat:
        model:                         # 对话模型名
        options:
          model:                       # 实际请求体中的 model（必配，仅配上层 model 不生效）
          temperature:                 # 采样温度
        completions-path: /chat/completions   # OpenAI 兼容对话路径（固定）
    mcp:
      client:                          # MCP 客户端（Step 3.3；连接失败不 fail-fast）
        enabled: true
        name: howtocook-app
        type: SYNC
        initialized: false             # 关闭启动期急切初始化，由 app/service/McpClientSupport 容错初始化
        toolcallback:
          enabled: true                # MCP 工具注册为 ToolCallback（Step 4.2 ChatClient 使用）
        sse:
          connections:
            mcp-tool-server:
              url:                     # mcp-tool-server 地址，如 http://localhost:18081
              sse-endpoint: /sse

# RocketMQ（Step 2.3；compose 已将 namesrv 映射到 127.0.0.1:9876）
rocketmq:
  name-server:                        # namesrv 地址，如 localhost:9876
  producer:
    group: howtocook-doc-producer     # 生产者组（固定）

# Spring AI MCP 客户端连接配置见上方 spring.ai.mcp.client（Step 3.3）；
# X-Internal-Token 请求头由 app/config/McpClientConfig 的请求定制器统一注入。

sa-token:                              # 具体项 Step 1.2 敲定
  token-name: Authorization            # Token 请求头名（固定）
  timeout:                             # Token 有效期（秒）
  active-timeout: -1                   # 活跃超时，-1 表示不限制
  is-concurrent: true                  # 是否允许多端登录
  is-share: true                       # 多端是否共用同一 Token
  token-style: uuid                    # Token 风格
  is-log: false

howtocook:
  chat:                              # 对话限流（Step 4.4）
    rate-limit-per-minute:           # 每用户每分钟对话次数上限（默认 10）
    max-concurrent-per-user:         # 每用户并发对话上限，JVM 信号量（默认 3）
  storage:                             # RustFS（S3 兼容）
    endpoint:                          # 环境变量 ${RUSTFS_ENDPOINT}
    access-key:                        # 环境变量 ${RUSTFS_ACCESS_KEY}
    secret-key:                        # 环境变量 ${RUSTFS_SECRET_KEY}
    bucket:                            # 桶名
  retrieval:
    vector-weight:                     # 向量融合权重（方案设计敲定）
    keyword-weight:                    # 关键词融合权重
    top-k:                             # 融合后返回条数
    recall-size:                       # 两路各自召回条数
  agent:
    max-rounds:                        # Agent 最大工具调用轮数
    tool-timeout-seconds:              # 单次工具调用超时（秒）
    memory-window:                     # ChatMemory 携带最近消息条数
  security:
    internal-token:                    # 环境变量 ${MCP_INTERNAL_TOKEN}，调 MCP Server 的预共享 Token

management:                            # 运维端点：仅放开 health
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never              # 不向前端暴露组件明细
