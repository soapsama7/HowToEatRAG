# =====================================================================
# RocketMQ Broker 配置（docker 内网部署，brokerIP1 指向容器名）
# 对应 rocketmq-spring-boot-starter 2.3.6（客户端 rocketmq-client 5.3.2）
# =====================================================================
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 文件保留与删除时间
deleteWhen = 04
fileReservedTime = 48

# 主从角色与刷盘策略（本地开发：异步，降低开销）
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 关键：容器内网寻址，指向 compose 服务名
namesrvAddr = rocketmq-namesrv:9876
brokerIP1 = rocketmq-broker

# 本地开发自动建 Topic（Step 2.3 的 doc-index-topic 无需手工创建）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
